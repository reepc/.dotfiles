# ~/.config/tmux/tmux.conf
# =============================================================================
#  Prefix
# =============================================================================
# Use backtick as the prefix key. Press ` twice to type a literal backtick.
unbind C-b
set -g prefix `
bind ` send-prefix          # `` sends a literal backtick

# =============================================================================
#  General / sane defaults
# =============================================================================
# True color + 256 color so nvim renders correctly inside tmux.
# 'tmux-256color' is the recommended terminfo; the Tc override enables 24-bit color.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Low escape-time: critical for Neovim so <Esc> isn't laggy.
set -sg escape-time 10

# Bigger scrollback buffer.
set -g history-limit 50000

# Focus events: lets nvim's autoread / FocusGained work inside tmux.
set -g focus-events on

# Start windows and panes at 1, not 0 (easier to reach on the keyboard).
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed so there are no gaps.
set -g renumber-windows on

# Rename windows automatically (keep names you set).
set -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"

# =============================================================================
#  Mouse
# =============================================================================
set -g mouse on

# =============================================================================
#  Clipboard (OSC 52)
# =============================================================================
# Send copied text to your LOCAL system clipboard via the terminal,
# even when tmux is running on a remote machine over SSH.
# Requires a terminal that supports OSC 52 (iTerm2, kitty, WezTerm,
# Alacritty, Windows Terminal, recent xterm, etc.).
set -g set-clipboard on

# =============================================================================
#  Copy mode (vi style)
# =============================================================================
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Enter copy mode with prefix + [ (default) — also bind Escape-free scroll via mouse.

# =============================================================================
#  Pane / window keybindings
# =============================================================================
# Split panes with | and - , and open new panes in the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in the current path too.
bind c new-window -c "#{pane_current_path}"

# Pane navigation (tmux-only; vim handles its own splits separately).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable: hold prefix-released, tap H/J/K/L).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick config reload.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# =============================================================================
#  Status bar position / general
# =============================================================================
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-right-length 100
set -g status-left-length 100

# -----------------------------------------------------------------------------
#  EXPERIMENT: Catppuccin Frappe status bar (managed by the plugin below).
#  The Catppuccin plugin sets status colors itself, so the old hand-rolled
#  One Dark Pro bar is commented out below for an easy revert.
# -----------------------------------------------------------------------------
# NOTE: requires a Nerd Font in your terminal for icons/separators to render.

# Catppuccin options (must be set BEFORE the plugin's run line at the bottom).
set -g @catppuccin_flavor 'frappe'          # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style 'rounded'   # basic, rounded, slanted

# Build the status line using Catppuccin modules.
# Left: session name. Right: directory + date/time.
set -g status-left ""
set -ag status-left "#{E:@catppuccin_status_session}"
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

