# =============================================================================
#  Plugins (tpm) — XDG layout under ~/.config/tmux/
# =============================================================================
# tpm must be cloned to ~/.config/tmux/plugins/tpm
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
#
# Tell tpm to install/manage plugins under the XDG path (not ~/.tmux/plugins).
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # universally agreed-upon defaults
set -g @plugin 'tmux-plugins/tmux-yank'       # better copy-mode yank, integrates with set-clipboard
set -g @plugin 'catppuccin/tmux#v2.3.0'       # EXPERIMENT: Frappe status bar (pinned version)

# tmux-yank: keep selection visible after yank instead of exiting copy mode? (off = exit)
set -g @yank_action 'copy-pipe-and-cancel'

# -----------------------------------------------------------------------------
# Keep this line at the VERY BOTTOM of the file.
run '~/.config/tmux/plugins/tpm/tpm'
